# Duvar Kağıdı:wallpaper
exec --no-startup-id feh --bg-fill ~/wallpaper/px.jpg

# Bar (Polybar)
#exec --no-startup-id polybar main

# picom
#exec --no-startup-id picom --config ~/.config/picom/picom.conf -b

# Tiling seçeneği
exec --no-startup-id autotiling

# Hz aşırtma
#exec --no-startup-id nvidia-settings -a "[gpu:0]/GPUGraphicsClockOffset[2]=100" -a "[gpu:0]/GPUMemoryTransferRateOffset[2]=300"

# Bildirim Yöneticisi
exec --no-startup-id dunst

# Pano (Clipboard) Yöneticisi
exec --no-startup-id copyq

# Polkit Yetkilendirme (Arch'ta paketten pakete yol değişir, kurulu olanı bulup çalıştırır)
exec --no-startup-id sh -c '\
  for a in /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 \
           /usr/lib/polkit-kde-authentication-agent-1 \
           /usr/bin/lxpolkit /usr/bin/lxqt-policykit-agent; do \
    [ -x "$a" ] && exec "$a"; \
  done'

# Ekran görüntülerinin gideceği klasörü garanti altına al
exec --no-startup-id mkdir -p ~/Pictures/Screenshots

# Ekran Çözünürlüğü ve Yenileme Hızı
exec --no-startup-id xrandr --output eDP-1 --mode 1920x1080 --rate 60.01 --pos 0x0 --scale 1x1

# Klavye Düzeni ve Hızı
exec --no-startup-id setxkbmap tr
exec --no-startup-id xset r rate 200 35
exec --no-startup-id numlockx on

# Touchpad Ayarları (libinput)
exec --no-startup-id xinput set-prop "SynPS/2 Synaptics TouchPad" "libinput Tapping Enabled" 1
exec --no-startup-id xinput set-prop "SynPS/2 Synaptics TouchPad" "libinput Natural Scrolling Enabled" 1
exec --no-startup-id xinput set-prop "SynPS/2 Synaptics TouchPad" "libinput Disable While Typing Enabled" 0

# Ekran Kararmasını ve Otomatik Uykuyu Kapatma
exec --no-startup-id xset s off
exec --no-startup-id xset -dpms
exec --no-startup-id xset s noblank
