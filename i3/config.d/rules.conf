# Odaklanma Davranışı
focus_follows_mouse yes

# Masaüstü Atamaları (Assign)
assign [class="^firefox$"] 2
assign [class="^librewolf$"] 2
assign [class="^brave-browser$"] 2
assign [class="^discord$"] 6
assign [class="^dev.zed.Zed$"] 5
assign [class="^Spotify$"] 3
assign [class="^kitty$"] 1

# Floating (Yüzen) Pencereler
for_window [class="(?i)^pavucontrol$"] floating enable
for_window [class="(?i)^copyq$"] floating enable
for_window [class="(?i)^blueman-manager$"] floating enable
for_window [class="(?i)^localsend"] floating enable
for_window [class="(?i)^thunar$"] move to workspace number 3

# Yazi ve Nvim için yakalama
# NOT: title yerine instance kullanılıyor. Kitty penceresi map olduğu anda
# WM_CLASS (instance) zaten hazırdır, title ise sonradan set edildiği için
# assign [class="^kitty$"] 1 ile yarışa girip bazen hiç eşleşmiyordu.
# binds.conf içinde kitty artık --name yazi / --name nvim ile açılıyor.
for_window [class="^kitty$" instance="^yazi$"] move to workspace 3
for_window [class="^kitty$" instance="^nvim$"] move to workspace 5

# Ncspot scratchpad kuralı config.d/specialws.conf içinde tanımlı (burada tekrar etmiyoruz)
