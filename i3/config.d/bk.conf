# --- SES VE MİKROFON AYARLARI ---
# Ses Artırma
bindsym XF86AudioRaiseVolume exec --no-startup-id wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+ -l 1.0 && dunstify -a "volume" -u low -h string:x-dunst-stack-tag:volume -h int:value:"$(wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk '{print int($2 * 100)}')" "Ses: $(wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk '{print int($2 * 100)}')%"

# Ses Azaltma
bindsym XF86AudioLowerVolume exec --no-startup-id wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- && dunstify -a "volume" -u low -h string:x-dunst-stack-tag:volume -h int:value:"$(wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk '{print int($2 * 100)}')" "Ses: $(wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk '{print int($2 * 100)}')%"

# Sessize Alma / Açma
bindsym XF86AudioMute exec --no-startup-id wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && dunstify -a "volume" -u low -h string:x-dunst-stack-tag:volume "Ses Durumu Değişti"

# Mikrofon Sessize Alma
bindsym XF86AudioMicMute exec --no-startup-id wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle && dunstify -a "volume" -u low -h string:x-dunst-stack-tag:volume "Mikrofon Durumu Değişti"

# Medya Tuşları
bindsym XF86AudioStop exec playerctl stop
bindsym XF86AudioPlay exec playerctl play-pause

# --- PARLAKLIK AYARLARI ---
# Parlaklık Artırma
bindsym XF86MonBrightnessUp exec --no-startup-id brightnessctl --class=backlight set +10% && dunstify -a "brightness" -u low -h string:x-dunst-stack-tag:brightness -h int:value:"$(brightnessctl -m | cut -d, -f4 | tr -d %)" "Parlaklık"

# Parlaklık Azaltma
bindsym XF86MonBrightnessDown exec --no-startup-id brightnessctl --class=backlight set 10%- && dunstify -a "brightness" -u low -h string:x-dunst-stack-tag:brightness -h int:value:"$(brightnessctl -m | cut -d, -f4 | tr -d %)" "Parlaklık"

# Ekran Görüntüsü (Maim + Xclip)
bindsym Print exec maim | xclip -selection clipboard -t image/png
bindsym Shift+Print exec maim -s | xclip -selection clipboard -t image/png
bindsym $mod+p exec maim -s ~/Pictures/Screenshots/$(date +%Y-%m-%d-%H%M%S).png

# Pencere Temel Yönetimi
bindsym $mod+q kill
bindsym $mod+f fullscreen toggle
bindsym $mod+space floating toggle

bindsym $mod+Left focus left
bindsym $mod+Right focus right
bindsym $mod+Up focus up
bindsym $mod+Down focus down

# $mod + Sol Tık ile pencereyi taşı
floating_modifier $mod

# Yenileme
bindsym $mod+Shift+c reload
bindsym $mod+Shift+r restart

# Workspace Odaklanma
bindsym $mod+1 workspace number 1
bindsym $mod+2 workspace number 2
bindsym $mod+3 workspace number 3
bindsym $mod+4 workspace number 4
bindsym $mod+5 workspace number 5
bindsym $mod+6 workspace number 6
bindsym $mod+7 workspace number 7
bindsym $mod+8 workspace number 8
bindsym $mod+9 workspace number 9

# Pencereyi Workspace'e Taşıma
bindsym $mod+Shift+1 move container to workspace number 1
bindsym $mod+Shift+2 move container to workspace number 2
bindsym $mod+Shift+3 move container to workspace number 3
bindsym $mod+Shift+4 move container to workspace number 4
bindsym $mod+Shift+5 move container to workspace number 5
bindsym $mod+Shift+6 move container to workspace number 6
bindsym $mod+Shift+7 move container to workspace number 7
bindsym $mod+Shift+8 move container to workspace number 8
bindsym $mod+Shift+9 move container to workspace number 9

# Workspace Geçişleri
bindsym $mod+Ctrl+Next workspace next
bindsym $mod+Ctrl+Prior workspace prev
bindsym $mod+Ctrl+u workspace next
bindsym $mod+Ctrl+i workspace prev
bindsym $mod+button4 workspace prev
bindsym $mod+button5 workspace next
