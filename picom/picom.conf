# ==========================================
# BACKEND VE RENDER AYARLARI (Nvidia Optimus + Intel)
# ==========================================
backend = "glx";
vsync = true;

# Nvidia GLX sürücüsündeki bilinen pencere-açılışı beyaz flaş / yarım çizim
# sorununun DOĞRU çözümü budur. Eskiden bunun yerine "use-damage = false"
# kullanılıyordu ama bu, ekranın TAMAMINI her karede yeniden çizdirip
# (damage tracking'i tamamen kapatıp) performansı ciddi şekilde düşürüyordu.
# xrender-sync-fence aynı sorunu damage tracking'i feda etmeden çözer.
xrender-sync-fence = true;

# Tam ekran bir pencere (oyun, video) varken picom o pencereyi compositing
# dışına alıp direkt ekran çıkışına bırakır -> tam ekranda maksimum FPS.
# NOT: i3'te tek pencere ekranı kapladığında da "fullscreen" sayılıyor ve
# bu pencere compositing dışına çıkıyor -> opacity/blur/shadow/shader tamamen
# devre dışı kalıyor (kitty transparency'sinin çalışmamasının sebebi buydu).
# Blur/transparency/shader öncelikliyse false kalmalı; sadece oyun FPS'i
# öncelikliyse true yapıp o an bunlardan vazgeçmiş olursun.
unredir-if-possible = false;

# ==========================================
# GÖRÜNÜM (ucuz efektler, gözle görülür performans maliyeti yok)
# ==========================================

# Gölge: sadece pencerelerin kenarında birkaç piksellik blur, GPU maliyeti
# blur'a göre çok düşük. Dock/desktop pencerelerinde (polybar vb.) anlamsız
# olduğu için hariç tutuluyor.
shadow = true;
shadow-radius = 6;
shadow-opacity = 0.5;
shadow-offset-x = -6;
shadow-offset-y = -6;
shadow-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

# Açılış/kapanış fade'i: adım büyük, delta küçük -> geçiş ~50ms'de bitiyor.
# Göze hoş geliyor ama uzun animasyon gibi kare kare GPU yormuyor.
fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 4;
fade-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

# Köşe yuvarlama: küçük yarıçap, dock/desktop hariç. NOT: round-borders
# (i3'ün 1px border'ını da yuvarlar) picom >= v10 gerektirir; sürümün
# eskiyse alttaki satırı açma, "unknown option" hatası verir.
corner-radius = 6;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];
# round-borders = 1;

# ==========================================
# BLUR AYARLARI (Sadece Kitty)
# ==========================================
blur: {
  method = "dual_kawase";
  strength = 5;
};

# Kitty DIŞINDAKİ tüm pencereleri blur'dan hariç tut.
# class_i (case-insensitive) kullanınca 'kitty'/'Kitty' için ayrı ayrı
# satır yazmaya gerek kalmıyor.
blur-background-exclude = [
  "class_i != 'kitty'",
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

# ==========================================
# CUSTOM SHADER (Doygunluk / siyah düzeltme)
# ==========================================
# saturation.glsl hyprshade formatındaydı, picom'un window_shader() /
# default_post_processing() arayüzüne göre yeniden yazıldı (ayrı dosya).
# Dock/desktop'u diğer efektler gibi hariç tutuyoruz; oradaki pencerelere
# renk shader'ı uygulamanın bir anlamı yok.
window-shader-fg-rule = [
  "/home/deces/.config/picom/saturation.glsl:window_type != 'dock' && window_type != 'desktop'"
];

# ==========================================
# GENEL PENCERE YÖNETİMİ
# ==========================================
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
