# ==========================================
# BACKEND VE RENDER AYARLARI
# ==========================================
backend = "glx";
vsync = true;
xrender-sync-fence = true;
unredir-if-possible = false;

# ==========================================
# GÖRÜNÜM & EFEKTLER (Hafifletildi)
# ==========================================

# Gölge ve Fading (Açılış animasyonları) performans için kapatıldı
shadow = false;
fading = false;

# Hafif köşe yuvarlama (İstersen 0 yapıp tamamen kapatabilirsin)
corner-radius = 6;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

# ==========================================
# BLUR (GPU'yu en çok yoran kısım tamamen kapatıldı)
# ==========================================
# Dual-kawase blur kapatıldı. st terminalinde şeffaflık
# blur olmadan tüy gibi hafif ve akıcı çalışır.

# ==========================================
# CUSTOM SHADER (Doygunluk - DOKUNULMADI)
# ==========================================
# window-shader-fg-rule = [
#  "/home/deces/.config/picom/saturation.glsl:window_type != 'dock' && window_type != 'desktop'"
#];

# ==========================================
# GENEL PENCERE YÖNETİMİ
# ==========================================
mark-wmwin-focused = true;
mark-ovredir-focused = true;
#detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
